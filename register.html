<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="external.css">

    <style>

        .register-page {
            min-height: 100vh;
            background: var(--light);
            padding: 130px 20px 70px;
        }

        .register-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(24, 31, 57, 0.1);
        }

        .register-box h1 {
            color: var(--navy);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .register-box > p {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .form-label {
            color: var(--text);
            font-size: 14px;
            font-weight: bold;
        }

        .form-control {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        .form-control:focus {
            border-color: var(--coral);
            box-shadow: none;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-link a {
            color: var(--navy);
            font-weight: bold;
        }

        .success-message {
            display: none;
            color: #24735b;
            background: var(--mint);
            border: none;
            border-radius: 7px;
            text-align: center;
            padding: 12px;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg fixed-top">

    <div class="container">

        <a
            class="nav-link"
            href="home.html">

            Home

        </a>


        <div class="ms-auto">

            <a
                href="login.html"
                class="btn btn-outline-light btn-sm">

                Login

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     CREATE ACCOUNT
===================================================== -->

<section class="register-page">

    <div class="container">

        <div class="register-box">

            <div class="eyebrow">

                JOIN US

            </div>


            <h1>

                Create Account

            </h1>


            <p>

                Create an account to book and manage your events.

            </p>


            <form onsubmit="createAccount(event)">


                <!-- FULL NAME -->

                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label">

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        required>

                </div>



                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="btn btn-create register-btn">

                    Create Account

                </button>

            </form>



            <!-- SUCCESS MESSAGE -->

            <div
                id="successMessage"
                class="success-message">

                Account created successfully!

            </div>



            <!-- LOGIN LINK -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<script>

async function createAccount(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    // Check passwords
    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    try {

        const response = await fetch("http://localhost:5000/api/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (response.ok) {

            alert("Account created successfully!");

            document.querySelector("form").reset();

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}

</script>


</body>

</html>
