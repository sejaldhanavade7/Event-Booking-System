<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Event</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="external.css">

    <style>
        .add-event-page {
            min-height: 100vh;
            background: var(--light);
            padding: 60px 20px;
        }

        .event-form-container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(24, 31, 57, 0.08);
        }

        .page-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-heading h1 {
            color: var(--navy);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: var(--muted);
            margin: 0;
        }

        .form-label {
            color: var(--text);
            font-weight: 600;
        }

        .form-control,
        .form-select {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--coral);
            box-shadow: 0 0 0 0.2rem rgba(253, 165, 151, 0.2);
        }

        .create-event-btn:hover {
            background: var(--coral);
            color: var(--navy);
        }

        .back-btn {
            color: var(--navy);
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            color: var(--coral);
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: var(--mint);
            color: var(--navy);
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .error-message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .event-form-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="add-event-page">

        <div class="event-form-container">

            <a href="admin.html" class="back-btn">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>

            <div class="page-heading">
                <h1>Add New Event</h1>
                <p>Create and publish a new event</p>
            </div>

            <form id="eventForm">

                <!-- Event Name -->
                <div class="mb-3">
                    <label for="eventName" class="form-label">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="eventName"
                        class="form-control"
                        placeholder="Enter event name"
                        required>
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label for="category" class="form-label">
                        Category
                    </label>

                    <select id="category" class="form-select" required>
                        <option value="">Select category</option>
                        <option>Music</option>
                        <option>Food</option>
                        <option>Business</option>
                        <option>Sports</option>
                        <option>Art</option>
                        <option>Technology</option>
                    </select>
                </div>

                <div class="row">

                    <!-- Date -->
                    <div class="col-md-6 mb-3">
                        <label for="eventDate" class="form-label">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="eventDate"
                            class="form-control"
                            required>
                    </div>

                    <!-- Time -->
                    <div class="col-md-6 mb-3">
                        <label for="eventTime" class="form-label">
                            Event Time
                        </label>

                        <input
                            type="time"
                            id="eventTime"
                            class="form-control"
                            required>
                    </div>

                </div>

                <!-- Venue -->
                <div class="mb-3">
                    <label for="venue" class="form-label">
                        Venue
                    </label>

                    <input
                        type="text"
                        id="venue"
                        class="form-control"
                        placeholder="Enter event venue"
                        required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Event Description
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="5"
                        placeholder="Enter event description"
                        required></textarea>
                </div>

                <!-- Banner -->
                <div class="mb-3">
                    <label for="banner" class="form-label">
                        Event Banner
                    </label>

                    <input
                        type="file"
                        id="banner"
                        class="form-control"
                        accept="image/*">
                </div>

                <div class="row">
                    <!-- Ticket Price -->
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">
                            Ticket Price (₹)
                        </label>
                        <input
                            type="number"
                            id="price"
                            class="form-control"
                            placeholder="0 for Free event"
                            min="0"
                            value="0">
                    </div>

                    <!-- Number of Seats -->
                    <div class="col-md-6 mb-3">
                        <label for="seats" class="form-label">
                            Number of Seats
                        </label>
                        <input
                            type="number"
                            id="seats"
                            class="form-control"
                            placeholder="Enter available seats"
                            min="1"
                            value="100"
                            required>
                    </div>
                </div>

                <!-- Submit / Create Button -->
                <div class="text-center mt-4">
                    <button type="submit" id="submitBtn" class="create-event-btn">
                        Create Event
                    </button>
                </div>

            </form>

            <div id="successMessage" class="success-message">
                Event created successfully! Redirecting to Manage Events...
            </div>

            <div id="errorMessage" class="error-message"></div>

        </div>

    </main>

    <script>
    document.getElementById("eventForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const successBox = document.getElementById("successMessage");
        const errorBox = document.getElementById("errorMessage");

        successBox.style.display = "none";
        errorBox.style.display = "none";

        const title = document.getElementById("eventName").value.trim();
        const category = document.getElementById("category").value;
        const date = document.getElementById("eventDate").value;
        const time = document.getElementById("eventTime").value;
        const venue = document.getElementById("venue").value.trim();
        const description = document.getElementById("description").value.trim();
        const price = document.getElementById("price").value;
        const seats = document.getElementById("seats").value;
        const bannerFile = document.getElementById("banner").files[0];

        // Prepare FormData for multipart upload
        const formData = new FormData();
        formData.append("title", title);
        formData.append("category", category);
        formData.append("date", date);
        formData.append("time", time);
        formData.append("venue", venue);
        formData.append("location", venue);
        formData.append("description", description);
        formData.append("price", price || 0);
        formData.append("availableSeats", seats || 100);

        if (bannerFile) {
            formData.append("banner", bannerFile);
        }

        // Attach logged-in user if available
        try {
            const loggedInUser = JSON.parse(localStorage.getItem("loggedInUser") || "{}");
            if (loggedInUser.id || loggedInUser._id) {
                formData.append("organizer", loggedInUser.id || loggedInUser._id);
            }
            if (loggedInUser.name) {
                formData.append("organizerName", loggedInUser.name);
            }
        } catch (e) {
            console.warn("Could not read loggedInUser:", e);
        }

        try {
            submitBtn.disabled = true;
            submitBtn.innerText = "Publishing Event...";

            const response = await fetch("http://localhost:5000/api/events", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                successBox.style.display = "block";
                document.getElementById("eventForm").reset();

                setTimeout(() => {
                    window.location.href = "manage-events.html";
                }, 1200);
            } else {
                errorBox.innerText = data.message || "Failed to create event.";
                errorBox.style.display = "block";
            }
        } catch (error) {
            console.error("Create event network error:", error);
            errorBox.innerText = "Unable to connect to backend server. Make sure it is running on http://localhost:5000.";
            errorBox.style.display = "block";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Event";
        }
    });
    </script>

</body>
</html>
